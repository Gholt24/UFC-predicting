<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Matchup Predictor - Tomorrow's Fight Night</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .corner-box {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        select {
            width: 100%;
            padding: 5px;
        }
    </style>
</head>
<body>

    <h2>UFC Matchup Predictor</h2>
    <p><em>Featured Event: UFC Fight Night: Nurmagomedov vs. Song</em></p>
    
    <label for="division-select"><strong>Division:</strong></label>
    <select id="division-select" style="margin-bottom: 20px;">
        <option value="All">All Divisions</option>
        <option value="Bantamweight">Bantamweight</option>
        <option value="Flyweight">Flyweight</option>
        <option value="Strawweight">Strawweight</option>
        <option value="Featherweight">Featherweight</option>
        <option value="Light Heavyweight">Light Heavyweight</option>
        <option value="Welterweight">Welterweight</option>
    </select>

    <div class="corner-box">
        <h3>Red Corner</h3>
        <input type="text" id="red-search" placeholder="Search Red Corner fighter...">
        <select id="red-fighter-select" size="6"></select>
    </div>

    <div class="corner-box">
        <h3>Blue Corner</h3>
        <input type="text" id="blue-search" placeholder="Search Blue Corner fighter...">
        <select id="blue-fighter-select" size="6"></select>
    </div>

    <h3 id="prediction-result"></h3>

    <script>
        // Tomorrow's Fight Card Fighters
        const fighters = [
            // Bantamweight
            { name: "Umar Nurmagomedov", division: "Bantamweight" },
            { name: "Song Yadong", division: "Bantamweight" },
            { name: "Aoriqileng", division: "Bantamweight" },
            { name: "Kai Asakura", division: "Bantamweight" },
            { name: "Xiao Long", division: "Bantamweight" },
            { name: "Francesco Nuzzi", division: "Bantamweight" },
            { name: "Lawrence Lui", division: "Bantamweight" },
            { name: "Hector Santiago", division: "Bantamweight" },
            
            // Flyweight
            { name: "Alex Perez", division: "Flyweight" },
            { name: "Su Mudaerji", division: "Flyweight" },
            { name: "Bilal Hasan", division: "Flyweight" },
            { name: "Nilson Rojas", division: "Flyweight" },
            { name: "Rei Tsuruya", division: "Flyweight" },
            { name: "Kevin Borjas", division: "Flyweight" },
            { name: "Namsrai Batbayar", division: "Flyweight" },
            { name: "André Lima", division: "Flyweight" },

            // Strawweight
            { name: "Yan Xiaonan", division: "Strawweight" },
            { name: "Denise Gomes", division: "Strawweight" },
            { name: "Xiong Jingnan", division: "Strawweight" },
            { name: "Julia Polastri", division: "Strawweight" },

            // Featherweight
            { name: "Jack Jenkins", division: "Featherweight" },
            { name: "Sean Woodson", division: "Featherweight" },

            // Light Heavyweight
            { name: "Liu Ce", division: "Light Heavyweight" },
            { name: "Levi Rodrigues Jr.", division: "Light Heavyweight" },

            // Welterweight
            { name: "Ding Meng", division: "Welterweight" },
            { name: "Cam Nelson", division: "Welterweight" }
        ];

        const redSearch = document.getElementById('red-search');
        const redSelect = document.getElementById('red-fighter-select');
        const blueSearch = document.getElementById('blue-search');
        const blueSelect = document.getElementById('blue-fighter-select');
        const divisionSelect = document.getElementById('division-select');

        function populateList(selectElement, filterText = '', selectedDivision = 'All') {
            selectElement.innerHTML = '';
            
            const filtered = fighters.filter(f => {
                const matchesName = f.name.toLowerCase().includes(filterText.toLowerCase());
                const matchesDiv = selectedDivision === 'All' || f.division === selectedDivision;
                return matchesName && matchesDiv;
            });

            filtered.forEach(fighter => {
                const option = document.createElement('option');
                option.value = fighter.name;
                option.textContent = `${fighter.name} (${fighter.division})`;
                selectElement.appendChild(option);
            });
        }

        redSearch.addEventListener('input', (e) => {
            populateList(redSelect, e.target.value, divisionSelect.value);
        });

        blueSearch.addEventListener('input', (e) => {
            populateList(blueSelect, e.target.value, divisionSelect.value);
        });

        divisionSelect.addEventListener('change', (e) => {
            populateList(redSelect, redSearch.value, e.target.value);
            populateList(blueSelect, blueSearch.value, e.target.value);
        });

        // Initial Load
        populateList(redSelect);
        populateList(blueSelect);
    </script>

</body>
</html>
